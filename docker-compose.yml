# Spuštění:  docker compose up -d --build
# Aplikace:  http://localhost:8080
services:
  app:
    build: .
    container_name: knihovna-app
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      # Při vývoji mapujeme zdrojáky do kontejneru -> změny jsou vidět hned bez rebuildu
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: knihovna-db
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Skripty v tomto adresáři se spustí JEN při prvním startu (prázdný volume)
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Volitelné: docker compose --profile tools up -d  ->  http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # Volitelné: docker compose --profile dev up sass  -> hlídá a kompiluje SCSS
  sass:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run watch"

volumes:
  db_data:
